<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments" id="comments">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div class="data">13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text" id="add-form-name"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea" id="add-form-text"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button id="add-form-button" class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  <div id = comments-container></div>
  <script>
    "use strict";
    // Код писать здесь
    const addName = document.getElementById('add-form-name');
    const addText = document.getElementById('add-form-text');
    const buttonForm = document.getElementById('add-form-button');
    const addComments = document.getElementById('comments');

    addName.addEventListener('input', (event) =>  {
      console.log('Изменить имя:', event.target.value );
    });
    addText.addEventListener('input', (event) =>  {
      console.log('Изменить комментарии:', event.target.value );
    });

    buttonForm.addEventListener('click', () => {
      const nameValue = addName.value.trim();
      const textValue = addText.value.trim();
      if (nameValue === '' || textValue === '') {
        alert(' Пожалуйста, заполните поля!');
        return;
      }
      console.log("click");

    //формирование даты и времени
    const now =new Date();
    const dateOptions = { day: '2-digit', month: '2-digit', year: '2-digit' };
    const timeOptions = { hour: '2-digit', minute: '2-digit' };
    const currentDate = now.toLocaleDateString('ru-RU', dateOptions);
    const currentTime = now.toLocaleTimeString('ru-RU', timeOptions);
    const currentDateTime = `${currentDate} ${currentTime}`;

    //сoздание шаблонной строки
    const newComments = `
    <div class="comment">
      <h4 class="comment-header">${nameValue}<span>           ${currentDateTime}</span></h4>
      <p class="comment-text">${textValue}</p>
      <div class="comment-footer"
      <div class="likes">
      <div class="likes-counter">0</div>
      <button class="like-button -active-like"></button></div>
    </div> 
    </div> `
;
    //новый комментарий в конец контейнера
    addComments.innerHTML = addComments.innerHTML + newComments;
   //addComments.insertAdjacentHTML('beforeend', newComments);
   addName.value = '';
   addText.value = '';
    });
  
    const commentsArray = [
  { id: 0,
    text: "Это будет первый комментарий на этой странице",
    likeCount: 3,
    isLiked: false
   },
  { id: 1,
    text: "Мне нравится как оформлена эта страница",
    likeCount: 75,
    isLiked: true
   }
];
  const container = document.getElementById("comments-container");

  function renderComments() {
      // Очищаем контейнер перед повторным рендером
      container.innerHTML = "";

      commentsArray.forEach((comment) => {
        // Указываем необходимый класс для иконки лайка в зависимости от значения ключа в массиве
        const heartClass = comment.isLiked ? "-active-like" : "like-button";
        const heartSymbol = comment.isLiked ? "❤️" : "🤍";
   const commentHtml = `
          <div class="comment">
            <p>${comment.text}</p>
            <button class="like-btn" data-id="${comment.id}">
              <span class="${heartClass}">${heartSymbol}</span>
              <span class="likes-count">${comment.likesCount}</span>
            </button>
          </div>
        `;
        container.insertAdjacentHTML("beforeend", commentHtml);
      });
    }
    container.addEventListener("click", (event) => {
      // Метод closest находит ближайшую кнопку лайка, даже если кликнули на иконку или цифру внутри неё
      const button = event.target.closest(".like-button");
      
      // Если клик был мимо кнопки лайка — игнорируем его
      if (!button) return;

      // Извлекаем ID комментария из дата-атрибута кнопки
      const commentId = parseInt(button.getAttribute("data-id"), 10);
      
      // Находим нужный элемент в массиве данных
      const targetComment = commentsArray.find(c => c.id === commentId);
      
      if (targetComment) {
        // Меняем значения ключей в массиве 
        if (targetComment.isLiked) {
          targetComment.isLiked = false;
          targetComment.likesCount--;
        } else {
          targetComment.isLiked = true;
          targetComment.likesCount++;
        }

        // Заново выполняем рендер всех комментариев на основе обновленного массива
        renderComments();
      }
    });

    // Первоначальный вызов функции рендера при загрузке страницы
    renderComments();

/*
   const updateComments = comments.map(comment => ({
    ...comment, likeCount: 0, isLiked: false 
   }));
   console.log(updateComments);*/

    console.log("It works!");
  </script>
    </body>

</html>
